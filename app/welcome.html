<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Welcome to CarBox</title>
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:#100f0f; overflow:hidden; }
  body{ font-family:'League Spartan',system-ui,-apple-system,'Segoe UI',sans-serif; }

  #stage{ position:fixed; inset:0; background:#100f0f; overflow:hidden; touch-action:manipulation; }

  /* the garage-door frames fill the screen (your originals, unaltered) and
     reveal the next, more-open frame on each tap — one continuous open */
  .door{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
         will-change:opacity; }

  /* quick fade to black before handing off to the Garage (which blur-reveals) */
  #fade{ position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .28s ease; }
</style>
</head>
<body>
<div id="stage" aria-label="Tap anywhere to continue">
  <img class="door" id="door" src="assets/ob_door0.png" alt="">
  <div id="fade"></div>
</div>

<script>
(function () {
  'use strict';
  /* tell the native shell to go dark so the safe-area insets aren't white */
  try { document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
  try { if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify({ theme: 'dark' })); } catch (e) {}

  var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  var stage = document.getElementById('stage');
  var door  = document.getElementById('door');
  var fade  = document.getElementById('fade');

  var DOORS = ['assets/ob_door0.png', 'assets/ob_door1.png', 'assets/ob_door2.png'];
  DOORS.forEach(function (s) { var i = new Image(); i.src = s; });   /* preload frames */

  var step = 0;      /* 0,1 -> open the next frame; 2 -> into the Garage */
  var busy = false;

  /* Reveal the next (more-open) frame by fading the current one away on top of
     it. The more-open frame sits fully opaque UNDERNEATH, so there's never a gap
     to black — it reads as one continuous garage door rolling open. */
  function openDoor(nextSrc) {
    busy = true;
    var incoming = door.cloneNode(false);
    incoming.removeAttribute('id');
    incoming.src = nextSrc;
    incoming.style.opacity = '1';
    stage.insertBefore(incoming, door);        /* underneath the current frame */
    var old = door; door = incoming;
    var dur = reduced ? 150 : 320;
    old.animate([{ opacity: 1 }, { opacity: 0 }], { duration: dur, easing: 'ease-in-out', fill: 'forwards' })
       .onfinish = function () { if (old.parentNode) old.parentNode.removeChild(old); busy = false; };
  }

  /* after the last tap, hand off to the Garage with the blur reveal */
  function goToGarage() {
    busy = true;
    try { sessionStorage.setItem('carbox.reveal', '1'); } catch (e) {}
    fade.style.opacity = '1';
    setTimeout(function () { location.replace('index.html?v=' + Date.now()); }, 260);
  }

  stage.addEventListener('click', function () {
    if (busy) return;
    if (step < 2) { step++; openDoor(DOORS[step]); }   /* door0 -> door1 -> door2 */
    else { goToGarage(); }                              /* 3rd tap opens the Garage */
  });
})();
</script>
</body>
</html>
