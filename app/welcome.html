<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Welcome to CarBox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --brown:#615142; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:#111010; overflow:hidden; }
  body{ font-family:'League Spartan',system-ui,-apple-system,'Segoe UI',sans-serif; }

  /* full-screen stage */
  #stage{ position:fixed; inset:0; background:#111010; overflow:hidden; touch-action:manipulation; }

  /* the garage-door images fill the screen; they swap + bounce on each tap */
  .door{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
         will-change:transform,opacity; transform:translateZ(0); }

  /* idle "Tap anywhere" text — a separate layer so the door can bounce beneath it */
  #tapText{ position:absolute; left:0; right:0; top:72%; text-align:center;
    color:#fff; font-weight:700; font-size:30px; letter-spacing:.5px;
    text-shadow:0 2px 18px rgba(0,0,0,.55);
    animation:breathe 2.4s ease-in-out infinite; pointer-events:none; }
  @keyframes breathe{ 0%,100%{opacity:.72} 50%{opacity:1} }

  /* the headlights video stage */
  #videoWrap{ position:absolute; inset:0; background:#000; opacity:0; pointer-events:none;
    display:flex; align-items:center; justify-content:center; }
  #vid{ width:100%; height:100%; object-fit:contain; background:#000; }

  /* brown Continue button — pops up at second 2 */
  #continue{ position:absolute; left:50%; bottom:6%; transform:translateX(-50%) scale(0);
    background:var(--brown); color:#fff; border:none; cursor:pointer;
    font-family:inherit; font-weight:700; font-size:19px; letter-spacing:.4px;
    padding:16px 54px; border-radius:999px; box-shadow:0 12px 30px rgba(0,0,0,.45);
    opacity:0; pointer-events:none; }
  #continue.show{ animation:pop .5s cubic-bezier(.3,1.4,.4,1) forwards; pointer-events:auto; }
  @keyframes pop{ 0%{transform:translateX(-50%) scale(0);opacity:0}
                  60%{transform:translateX(-50%) scale(1.08);opacity:1}
                  100%{transform:translateX(-50%) scale(1);opacity:1} }
  #continue:active{ filter:brightness(.92); }

  /* quick fade-to-black used right before handing off to the garage */
  #fade{ position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .28s ease; }

  @media (prefers-reduced-motion:reduce){
    #tapText{ animation:none; opacity:.9; }
  }
</style>
</head>
<body>
<div id="stage" aria-label="Tap anywhere to continue">
  <!-- video sits at the bottom of the stack so the door can zoom in FRONT of it,
       then fade away to reveal it -->
  <div id="videoWrap">
    <video id="vid" src="assets/ob_headlights.mp4" muted playsinline preload="auto"></video>
  </div>
  <img class="door" id="door" src="assets/ob_door0.png" alt="">
  <div id="tapText">Tap anywhere</div>
  <button id="continue">Continue</button>
  <div id="fade"></div>
</div>

<script>
(function () {
  'use strict';
  var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var SPRING = 'cubic-bezier(.3,1.4,.4,1)';

  var stage   = document.getElementById('stage');
  var door    = document.getElementById('door');
  var tapText = document.getElementById('tapText');
  var vwrap   = document.getElementById('videoWrap');
  var vid     = document.getElementById('vid');
  var cont    = document.getElementById('continue');
  var fade    = document.getElementById('fade');

  var DOORS = ['assets/ob_door0.png','assets/ob_door1.png','assets/ob_door2.png','assets/ob_door3.png'];
  /* preload every frame + the video so nothing hitches mid-sequence */
  DOORS.forEach(function (s) { var i = new Image(); i.src = s; });

  var step = 0;        /* 0,1,2 = door frames shown; then 'video' */
  var busy = false;    /* lock during transitions so taps can't stack */

  /* swap to the next door frame with a chest-open bounce (text stays put) */
  function openDoor(nextSrc) {
    busy = true;
    var incoming = door.cloneNode(false);
    incoming.removeAttribute('id');
    incoming.src = nextSrc;
    incoming.style.opacity = '0';
    door.parentNode.insertBefore(incoming, door.nextSibling);
    var old = door;
    door = incoming;

    var dur = reduced ? 220 : 470;
    var bounce = incoming.animate(
      [{ transform: 'scale(.84)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }],
      { duration: dur, easing: reduced ? 'ease-out' : SPRING, fill: 'forwards' }
    );
    /* cross-fade the previous frame out under the incoming one */
    var fadeOut = old.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, easing: 'ease-out', fill: 'forwards' });
    fadeOut.onfinish = function () { if (old.parentNode) old.parentNode.removeChild(old); };
    /* stay locked until the bounce fully settles so fast taps can't stack */
    bounce.onfinish = function () { busy = false; };
  }

  /* final tap: dive into the open garage, then reveal the headlights video */
  function zoomIntoGarage() {
    busy = true;
    /* text fades away for the zoom (stop the idle breathe so they don't fight) */
    tapText.style.animation = 'none';
    tapText.animate([{ opacity: getComputedStyle(tapText).opacity }, { opacity: 0 }],
      { duration: 180, easing: 'ease-out', fill: 'forwards' });

    /* swap to the transparent, text-free fully-open frame (aligned with the last) */
    var zoom = door.cloneNode(false);
    zoom.removeAttribute('id');
    zoom.src = 'assets/ob_door3.png';
    door.parentNode.insertBefore(zoom, door.nextSibling);
    var old = door; door = zoom;
    if (old.parentNode) old.parentNode.removeChild(old);
    zoom.style.transformOrigin = '50% 53%';   /* dive into the glowing doorway */

    /* start the video underneath so it's ready as the yellow fills the screen */
    vwrap.style.opacity = '1';
    var playing = vid.play();
    if (playing && playing.catch) playing.catch(function () {});
    armContinue();

    var dur = reduced ? 500 : 720;
    /* fast zoom that eases IN (accelerates) toward the glowing doorway */
    var z = zoom.animate(
      [{ transform: 'scale(1)' }, { transform: 'scale(12)' }],
      { duration: dur, easing: 'cubic-bezier(.55,.06,.9,.32)', fill: 'forwards' }
    );
    /* fade the zooming frame out over the last third so it dissolves into the video */
    zoom.animate([{ opacity: 1, offset: 0 }, { opacity: 1, offset: 0.62 }, { opacity: 0, offset: 1 }],
      { duration: dur, easing: 'linear', fill: 'forwards' });
    z.onfinish = function () { if (zoom.parentNode) zoom.parentNode.removeChild(zoom); };
    step = 'video';
  }

  /* the Continue button pops up 2s in and survives to the last frame */
  var continueArmed = false;
  function armContinue() {
    if (continueArmed) return; continueArmed = true;
    setTimeout(function () {
      cont.style.opacity = '1';
      cont.classList.add('show');
    }, 2000);
  }

  stage.addEventListener('click', function (e) {
    if (e.target === cont) return;         /* the button handles itself */
    if (busy || step === 'video') return;
    if (step < 2) { step++; openDoor(DOORS[step]); }
    else { zoomIntoGarage(); }             /* step === 2 -> dive in */
  });

  cont.addEventListener('click', function () {
    cont.disabled = true;
    /* hand off to the garage with a reveal (index.html reads this flag) */
    try { sessionStorage.setItem('carbox.reveal', '1'); } catch (err) {}
    fade.style.opacity = '1';
    setTimeout(function () { location.replace('index.html?v=' + Date.now()); }, 260);
  });

  /* video never loops -> it naturally holds its last frame until Continue is tapped */
  vid.loop = false;
})();
</script>
</body>
</html>
