<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Coilover — Log in</title>
<style>html{background:#E9E9E9}</style>
<script>(function(){var t='system';try{t=(JSON.parse(localStorage.getItem('carbox.v1'))||{}).theme||'system'}catch(e){}if(t==='system')t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)})();</script>
<!-- Scanner-safe reset-link redirect: runs before anything else loads. The
     reset email points here with the REAL Supabase confirmation URL hidden in
     a #confirm= fragment (see server/README.md "Password reset email" note).
     Fragments are never sent in an HTTP request, so an email security scanner
     doing a plain fetch of this page never sees or consumes the real link —
     only a real browser running this script does, immediately forwarding to
     it. That real link is single-use, so this must fire once, fast, with no
     user action required. -->
<script>(function(){var h=location.hash.slice(1);var m=/^confirm=(.+)$/.exec(h);if(m)location.replace(m[1]);})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=League+Spartan:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script defer src="state.js"></script>
<script defer src="config.js"></script>
<script defer src="vendor/supabase.js"></script>
<script defer src="supabase.js"></script>
<style>
  .login{max-width:340px;margin:0 auto;padding:70px 22px 40px;font-family:'League Spartan',sans-serif}
  .login h1{font-family:'DM Serif Display',serif;font-size:34px;color:var(--tx,#141210);text-align:center}
  .login p{text-align:center;color:var(--warmgray,#7F7269);font-size:15px;margin-top:4px}
  .fld{margin-top:16px}
  .fld label{display:block;font-size:13px;font-weight:600;color:var(--mut,#8D8579);margin-bottom:5px}
  .fld input{width:100%;box-sizing:border-box;padding:13px 14px;border-radius:12px;border:1.5px solid rgba(0,0,0,.14);
    background:var(--surface,#F7F7F7);font-family:'League Spartan',sans-serif;font-size:16px;color:var(--tx,#141210)}
  .err{color:#c0392b;font-size:13.5px;font-weight:600;margin-top:12px;min-height:18px;text-align:center}
  .go{width:100%;margin-top:18px;background:var(--accent,#615142);color:#fff;border:none;border-radius:999px;
    padding:14px 0;font-family:'League Spartan',sans-serif;font-weight:700;font-size:16px;cursor:pointer}
  .go:disabled{opacity:.45;cursor:default}
  .alt{text-align:center;margin-top:18px;font-size:14px;color:var(--warmgray,#7F7269)}
  .alt a{color:var(--accent,#615142);font-weight:600;text-decoration:none}
</style>
</head>
<body>
  <div class="login" id="loginView">
    <h1>Welcome back</h1>
    <p>Log in to your Coilover garage</p>
    <div class="fld"><label>Email</label><input id="email" type="email" autocomplete="email" inputmode="email"></div>
    <div class="fld"><label>Password</label><input id="pass" type="password" autocomplete="current-password"></div>
    <div class="err" id="err"></div>
    <button class="go" id="go" disabled>Log in</button>
    <div class="alt"><a href="#" id="forgot">Forgot password?</a></div>
    <div class="alt">New here? <a href="onboarding.html">Create an account</a></div>
  </div>

  <!-- Shown instead of the form above when the page is opened from a password
       reset email — Supabase's link carries a recovery session in the URL,
       detected below via onAuthStateChange('PASSWORD_RECOVERY'). Hidden by
       default so a normal visit to login.html never shows this. -->
  <div class="login" id="resetView" style="display:none">
    <h1>Set a new password</h1>
    <p>Choose a new password for your Coilover account</p>
    <div class="fld"><label>New password</label><input id="newpass" type="password" autocomplete="new-password"></div>
    <div class="err" id="resetErr"></div>
    <button class="go" id="resetGo">Set new password</button>
  </div>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var loginView = document.getElementById('loginView'), resetView = document.getElementById('resetView');
  var email = document.getElementById('email'), pass = document.getElementById('pass');
  var go = document.getElementById('go'), err = document.getElementById('err');
  /* App Store reviewer demo login (see App Store Connect → App Review
     Information). Never touches Supabase — just loads a clean, fully
     populated local demo garage with Pro unlocked, so a reviewer can see
     every feature without a real account or a real purchase. This is the
     credential given to Apple; it's a local demo shortcut, not a backend
     bypass, so there's nothing of real value to protect here. */
  var REVIEWER_EMAIL = 'applereviewer', REVIEWER_PASS = '@ppleR3v!er';
  function isReviewerLogin() { return email.value.trim() === REVIEWER_EMAIL && pass.value === REVIEWER_PASS; }
  function valid() { return isReviewerLogin() || (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim()) && pass.value.length >= 1); }
  function refresh() { go.disabled = !valid(); err.textContent = ''; }
  email.addEventListener('input', refresh); pass.addEventListener('input', refresh);

  go.addEventListener('click', function () {
    if (!valid()) return;
    if (isReviewerLogin()) {
      go.disabled = true; err.style.color = 'var(--accent-tx,#5C7350)'; err.textContent = 'Loading review demo…';
      if (window.CarBox && CarBox.loadReviewerDemo) CarBox.loadReviewerDemo();
      location.replace('index.html');
      return;
    }
    if (!window.CarBoxAuth || !window.CarBoxAuth.available) {
      err.textContent = 'Connection not configured yet.'; return;
    }
    go.disabled = true; err.style.color = ''; err.textContent = 'Logging in…';
    CarBoxAuth.signIn(email.value.trim(), pass.value).then(function (res) {
      if (res && res.error) { err.textContent = res.error.message || 'Login failed'; go.disabled = false; return; }
      /* let the connector pull cloud state on the next load */
      try { sessionStorage.removeItem('cbPulled'); } catch (e) {}
      localStorage.setItem('cbSignedUp', '1');
      err.style.color = 'var(--accent-tx,#5C7350)'; err.textContent = 'Success, loading your garage…';
      location.replace('index.html');
    }, function () { err.textContent = 'Network error'; go.disabled = false; });
  });

  /* Forgot password: sends a Supabase reset email */
  document.getElementById('forgot').addEventListener('click', function (e) {
    e.preventDefault();
    var addr = email.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(addr)) { err.style.color = ''; err.textContent = 'Enter your email above first, then tap Forgot password.'; return; }
    if (!window.CarBoxAuth || !window.CarBoxAuth.resetPassword) { err.textContent = 'Connection not configured yet.'; return; }
    err.style.color = ''; err.textContent = 'Sending reset link…';
    CarBoxAuth.resetPassword(addr).then(function (res) {
      if (res && res.error) { err.textContent = res.error.message || 'Could not send reset email'; return; }
      err.style.color = 'var(--accent-tx,#5C7350)';
      err.textContent = 'Check your email for a password reset link.';
    }, function () { err.textContent = 'Network error'; });
  });

  /* ── Password recovery landing ──
     Supabase's reset-link click lands here with a recovery session encoded in
     the URL. supabase-js auto-detects it and fires PASSWORD_RECOVERY once the
     client's ready. Swap to the "set a new password" panel instead of showing
     a normal login form (which would otherwise ask for a password the user is
     here specifically because they forgot). */
  var newpass = document.getElementById('newpass');
  var resetGo = document.getElementById('resetGo'), resetErr = document.getElementById('resetErr');
  function showResetPanel() {
    loginView.style.display = 'none';
    resetView.style.display = '';
  }
  /* fast path: the URL itself says recovery, so switch immediately instead of
     waiting on the async event (avoids a flash of the login form). */
  if (/type=recovery/.test(location.hash) || /type=recovery/.test(location.search)) showResetPanel();

  if (window.sb && sb.auth && sb.auth.onAuthStateChange) {
    sb.auth.onAuthStateChange(function (event) {
      if (event === 'PASSWORD_RECOVERY') showResetPanel();
    });
  }

  if (resetGo) {
    resetGo.addEventListener('click', function () {
      var pw = newpass.value;
      if (!pw || pw.length < 6) { resetErr.style.color = ''; resetErr.textContent = 'Use at least 6 characters.'; return; }
      if (!window.CarBoxAuth || !window.CarBoxAuth.updatePassword) { resetErr.textContent = 'Connection not configured yet.'; return; }
      resetGo.disabled = true; resetErr.style.color = ''; resetErr.textContent = 'Saving…';
      CarBoxAuth.updatePassword(pw).then(function (res) {
        if (res && res.error) { resetErr.textContent = res.error.message || 'Could not set password'; resetGo.disabled = false; return; }
        resetErr.style.color = 'var(--accent-tx,#5C7350)';
        resetErr.textContent = 'Password updated — loading your garage…';
        try { localStorage.setItem('cbSignedUp', '1'); sessionStorage.removeItem('cbPulled'); } catch (e) {}
        setTimeout(function () { location.replace('index.html'); }, 900);
      }, function () { resetErr.textContent = 'Network error'; resetGo.disabled = false; });
    });
  }
});
</script>
</body>
</html>
